name: Bug report
description: Something went wrong
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    attributes:
      label: Output of `roomy --version` and `roomy doctor`
      render: text
    validations: { required: true }
  - type: checkboxes
    attributes:
      label: Removal
      options:
        - label: roomy removed or moved something it should not have (please also see SECURITY.md)
