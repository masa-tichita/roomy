name: Homebrew

# Publishes the formula for a release to masa-tichita/homebrew-tap, then installs it from the
# tap and runs `brew test`. Called by release.yml; run it by hand to redo a release's formula:
#   gh workflow run homebrew.yml -f tag=v0.1.0
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true

permissions:
  contents: read

jobs:
  formula:
    name: update the tap and install from it
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tap token
        run: |
          token=$(printf '%s' "$TAP_TOKEN" | tr -d '[:space:]')
          if [ -z "$token" ]; then
            echo "::error::secret HOMEBREW_TAP_TOKEN is missing or empty (see RELEASING.md)"
            exit 1
          fi
          # Try the token with git itself before doing anything else. (The REST API's
          # `permissions` field describes the account, not a fine-grained token, so it can't tell
          # whether the token was granted this repository.)
          auth=$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')
          if ! git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
              ls-remote https://github.com/masa-tichita/homebrew-tap.git HEAD >/dev/null 2>&1; then
            echo "::error::HOMEBREW_TAP_TOKEN cannot access masa-tichita/homebrew-tap: check that the token is valid and that its repository access includes homebrew-tap with Contents: Read and write (see RELEASING.md)"
            exit 1
          fi

      - name: Render the formula from the release's checksum
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern '*.sha256' --dir release
          sha=$(cut -d' ' -f1 release/*.sha256)
          ruby -e '
            t = File.read(ARGV[0]); c = File.read(ARGV[1])
            print t.gsub("@VERSION@", ARGV[2]).gsub("@SHA256@", ARGV[3]).sub("@COMPLETIONS@\n", c)
          ' packaging/homebrew/roomy.rb.in packaging/homebrew/completions.rb "${TAG#v}" "$sha" > roomy.rb
          ruby -c roomy.rb

      - name: Push it to masa-tichita/homebrew-tap
        run: |
          set -euo pipefail
          # A token pasted from the clipboard often ends with a newline; strip whitespace, and pass
          # it in a header instead of the URL so it never shows up in git's remote config.
          token=$(printf '%s' "$TAP_TOKEN" | tr -d '[:space:]')
          auth=$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          git clone https://github.com/masa-tichita/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp roomy.rb tap/Formula/roomy.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/roomy.rb
          if git diff --cached --quiet; then
            echo "formula already up to date"
          else
            git commit -m "roomy ${TAG#v}"
            git push
          fi

      - name: Install from the tap and run the formula test
        run: |
          brew install masa-tichita/tap/roomy
          brew test masa-tichita/tap/roomy
          roomy --version
