name: Release

# draft -> build -> publish -> homebrew and npm. Nothing is public until every asset is attached, and a
# missing CHANGELOG section or version mismatch stops the release before anything is built.
# Re-running a failed run reuses the draft; a published release is never touched.

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # The oldest macOS roomy supports (docs/DESIGN.md §12).
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  draft:
    name: check the tag and draft the release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches Cargo.toml
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Create the draft (or reuse it on a re-run)
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = "true" ]; then
              echo "draft for $GITHUB_REF_NAME exists (re-run); reusing it"
              exit 0
            fi
            echo "::error::$GITHUB_REF_NAME is already published; never re-release a version"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "roomy $GITHUB_REF_NAME" --notes-file notes.md

  build:
    name: universal binary
    needs: draft
    runs-on: macos-latest
    permissions:
      contents: write # upload assets to the draft
      id-token: write # sign the provenance attestation
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml selects the toolchain; add both macOS targets to it.
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # No build cache here: release binaries are built from scratch, so a poisoned cache from
      # another workflow cannot end up in them.

      - run: cargo test --locked

      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Combine, check and pack
        run: |
          set -euo pipefail
          name="roomy-${GITHUB_REF_NAME}-universal-apple-darwin"
          mkdir -p "dist/$name"
          lipo -create -output "dist/$name/roomy" \
            target/aarch64-apple-darwin/release/roomy \
            target/x86_64-apple-darwin/release/roomy
          lipo -archs "dist/$name/roomy" | grep -q "x86_64 arm64"
          # Apple Silicon refuses unsigned code. The linker signs only the arm64 slice
          # (ad hoc), so sign the universal binary as a whole and verify both slices.
          codesign --force --sign - "dist/$name/roomy"
          codesign --verify --strict --verbose=2 "dist/$name/roomy"
          "dist/$name/roomy" --version
          cp README.md README.ja.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "dist/$name/"
          tar -C "dist/$name" -czf "dist/$name.tar.gz" .
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # --clobber: a re-run replaces whatever a failed run left in the draft.
      - run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # undraft
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check every asset is attached, then publish
        run: |
          name="roomy-${GITHUB_REF_NAME}-universal-apple-darwin.tar.gz"
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for a in "$name" "$name.sha256"; do
            if ! grep -qxF "$a" <<<"$assets"; then
              echo "::error::$a is missing from the draft"
              exit 1
            fi
          done
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  homebrew:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

  npm:
    name: publish roomy-cli to npm
    needs: publish
    runs-on: macos-latest
    # npm trusted publishing (OIDC): no npm token is stored. npm accepts tokens only from this
    # workflow file in the `release` environment, so other jobs cannot publish.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # exact: trusted publishing needs npm >= 11.5.1; Node 24.21.0 ships npm 11.19.0
          node-version: "24.21.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # nothing to cache, and no cache in release jobs
      - run: packaging/npm/build.sh "$GITHUB_REF_NAME" npm-package
      - name: Publish (provenance is attached automatically)
        working-directory: npm-package
        run: npm publish --access public
