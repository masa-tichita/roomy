name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  # The oldest macOS roomy supports (docs/DESIGN.md §12).
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  build:
    name: universal binary and GitHub release
    runs-on: macos-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        name: Check the tag matches Cargo.toml
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --locked

      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - id: pack
        name: Combine, check and pack
        run: |
          set -euo pipefail
          name="roomy-${GITHUB_REF_NAME}-universal-apple-darwin"
          mkdir -p "dist/$name"
          lipo -create -output "dist/$name/roomy" \
            target/aarch64-apple-darwin/release/roomy \
            target/x86_64-apple-darwin/release/roomy
          lipo -archs "dist/$name/roomy" | grep -q "x86_64 arm64"
          # Apple Silicon refuses unsigned code. The linker signs only the arm64 slice
          # (ad hoc), so sign the universal binary as a whole and verify both slices.
          codesign --force --sign - "dist/$name/roomy"
          codesign --verify --strict --verbose=2 "dist/$name/roomy"
          "dist/$name/roomy" --version
          cp README.md README.ja.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "dist/$name/"
          tar -C "dist/$name" -czf "dist/$name.tar.gz" .
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "sha256=$(cut -d' ' -f1 "dist/$name.tar.gz.sha256")" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      - name: Release notes from CHANGELOG.md
        run: |
          version="${{ steps.meta.outputs.version }}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --title "roomy $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  homebrew:
    name: update the Homebrew tap and install from it
    needs: build
    runs-on: macos-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Render the formula
        run: |
          completions=$(cat packaging/homebrew/completions.rb)
          sed -e "s/@VERSION@/${{ needs.build.outputs.version }}/g" \
              -e "s/@SHA256@/${{ needs.build.outputs.sha256 }}/g" \
              packaging/homebrew/roomy.rb.in > roomy.rb.tmp
          awk -v c="$completions" '{ if ($0 == "@COMPLETIONS@") print c; else print }' roomy.rb.tmp > roomy.rb
          ruby -c roomy.rb

      - name: Push it to masa-tichita/homebrew-tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/masa-tichita/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp roomy.rb tap/Formula/roomy.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/roomy.rb
          git commit -m "roomy ${{ needs.build.outputs.version }}"
          git push

      - name: Install from the tap and run the formula test
        if: env.TAP_TOKEN != ''
        run: |
          brew install masa-tichita/tap/roomy
          brew test masa-tichita/tap/roomy
          roomy --version
