version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # `@stable` and `@1.88` select Rust toolchains (the MSRV job), not action versions.
      - dependency-name: dtolnay/rust-toolchain
