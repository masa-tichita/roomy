# The toolchain CI, releases and local builds use. Dependabot proposes upgrades as PRs, so a new
# Rust (and its new clippy lints) arrives on purpose, not by surprise. The MSRV (rust-version in
# Cargo.toml, 1.88) is checked separately in CI.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
